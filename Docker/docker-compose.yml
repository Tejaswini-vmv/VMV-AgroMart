version: '3.8'

services:
  # ============================================================================
  # MySQL Database
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: vmv-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vmv_agromart}
      MYSQL_USER: ${MYSQL_USER:-agromart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agromart_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - agromart-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vmv-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - agromart-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Backend API (Spring Boot)
  # ============================================================================
  backend:
    build:
      context: ../source-code/backend
      dockerfile: Dockerfile
    container_name: vmv-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-vmv_agromart}
      DB_USERNAME: ${MYSQL_USER:-agromart_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-agromart_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agromart-network
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # Web Frontend (Angular)
  # ============================================================================
  web-frontend:
    build:
      context: ../source-code/frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:8080/api}
    container_name: vmv-web-frontend
    restart: always
    ports:
      - "4201:80"
    depends_on:
      - backend
    networks:
      - agromart-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: vmv-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - web-frontend
    networks:
      - agromart-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # PhpMyAdmin (Optional - for database management)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vmv-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-agromart_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-agromart_password}
    ports:
      - "8083:80"
    depends_on:
      - mysql
    networks:
      - agromart-network
    profiles:
      - debug

  # ============================================================================
  # Redis Commander (Optional - for Redis management)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vmv-redis-commander
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - agromart-network
    profiles:
      - debug

# ============================================================================
# Networks
# ============================================================================
networks:
  agromart-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local
