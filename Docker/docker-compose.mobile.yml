version: '3.8'

# ============================================================================
# VMV AgroMart - Mobile App Development Configuration
# Optimized for mobile app development and testing
# ============================================================================

services:
  # ============================================================================
  # Backend API (Accessible from mobile devices)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmv-backend-mobile
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-vmv_agromart}
      DB_USERNAME: ${MYSQL_USER:-agromart_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-agromart_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - agromart-network

  # ============================================================================
  # MySQL Database
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: vmv-mysql-mobile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vmv_agromart}
      MYSQL_USER: ${MYSQL_USER:-agromart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agromart_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_mobile_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - agromart-network

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vmv-redis-mobile
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_mobile_data:/data
    networks:
      - agromart-network

  # ============================================================================
  # Mobile App Development Server (Ionic)
  # ============================================================================
  mobile-app:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: vmv-mobile-app
    restart: always
    environment:
      # Use host machine IP for API access from mobile devices
      API_URL: ${MOBILE_API_URL:-http://host.docker.internal:8080/api}
      NODE_ENV: development
    ports:
      - "8100:8100"  # Ionic dev server
      - "35729:35729"  # LiveReload
    volumes:
      - ./mobile-app:/app
      - /app/node_modules
      - mobile_build_output:/output
    depends_on:
      - backend
    networks:
      - agromart-network
    stdin_open: true
    tty: true
    command: ionic serve --external --port 8100 --no-open --disable-host-check

  # ============================================================================
  # Android Build Service (Optional)
  # ============================================================================
  android-builder:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile.android
    container_name: vmv-android-builder
    volumes:
      - ./mobile-app:/app
      - mobile_build_output:/output
    environment:
      API_URL: ${MOBILE_API_URL}
    networks:
      - agromart-network
    profiles:
      - build
    command: /build-android.sh

networks:
  agromart-network:
    driver: bridge

volumes:
  mysql_mobile_data:
  redis_mobile_data:
  mobile_build_output:
