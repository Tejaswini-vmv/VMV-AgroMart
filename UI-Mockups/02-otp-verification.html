<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMV AgroMart - OTP Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 8px solid #1a1a1a;
            position: relative;
        }
        .notch {
            width: 200px;
            height: 30px;
            background: #1a1a1a;
            margin: 0 auto;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .header {
            padding: 45px 20px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-right: 40px;
        }
        .app-content {
            padding: 40px 30px;
        }
        .icon-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .phone-display {
            background: #f5f5f5;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
        }
        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 30px 0;
        }
        .otp-input {
            width: 48px;
            height: 56px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            background: white;
            transition: all 0.3s;
        }
        .otp-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .otp-input.filled {
            background: #f0f4ff;
            border-color: #667eea;
            color: #667eea;
        }
        .timer-section {
            text-align: center;
            margin: 20px 0;
        }
        .timer {
            font-size: 14px;
            color: #666;
        }
        .timer-count {
            font-weight: 600;
            color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            width: 100%;
            padding: 18px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .resend-section {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
        .resend-link {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>

        <div class="header">
            <div class="back-btn">←</div>
            <div class="header-title">Verify OTP</div>
        </div>

        <div class="app-content">
            <div class="icon-section">
                <div class="icon-circle">📱</div>
                <div class="title">Enter OTP</div>
                <div class="subtitle">
                    We've sent a 6-digit code to<br>
                    your mobile number
                </div>
            </div>

            <div class="phone-display">
                +91 98234 58001
            </div>

            <div class="otp-inputs">
                <input type="text" class="otp-input filled" value="1" maxlength="1">
                <input type="text" class="otp-input filled" value="2" maxlength="1">
                <input type="text" class="otp-input filled" value="3" maxlength="1">
                <input type="text" class="otp-input filled" value="4" maxlength="1">
                <input type="text" class="otp-input filled" value="5" maxlength="1">
                <input type="text" class="otp-input filled" value="6" maxlength="1">
            </div>

            <div class="timer-section">
                <div class="timer">
                    Code expires in <span class="timer-count">04:45</span>
                </div>
            </div>

            <button class="btn-primary">Verify & Continue</button>
            <button class="btn-secondary">Change Number</button>

            <div class="resend-section">
                Didn't receive code?
                <a href="#" class="resend-link">Resend OTP</a>
            </div>
        </div>
    </div>
</body>
</html>
