server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the SPA shell that references hashed bundle filenames (main.<hash>.js).
    # Never let browsers/proxies cache it, or a redeployed app can keep serving an old bundle
    # reference until a hard refresh. The hashed JS/CSS assets themselves are safe to cache
    # long-term since their filename changes whenever their content changes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
